name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  tag-version:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python scripts/check_tag_version.py "$GITHUB_REF_NAME"

  release:
    if: github.ref_type == 'tag'
    needs: tag-version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="$GITHUB_REF_NAME"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, leaving it unchanged."
            exit 0
          fi
          PREV=""
          for t in $(git tag --list 'v*' --sort=v:refname); do
            if [ "$t" = "$TAG" ]; then
              break
            fi
            PREV="$t"
          done
          if [ -n "$PREV" ]; then
            echo "Creating release $TAG with notes since $PREV."
            gh release create "$TAG" --title "$TAG" --generate-notes --notes-start-tag "$PREV"
          else
            echo "Creating release $TAG with notes (no previous tag)."
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --extra dev
      - run: uv run ruff check

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --extra dev
      # Several tests commit to throwaway repos and rely on an ambient identity.
      - run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.invalid"
      - run: uv run pytest
