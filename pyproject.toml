[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "simple-coding-agent"
version = "0.9.0"
description = "An unattended coding agent for one GitHub repository."
requires-python = ">=3.11"
dependencies = [
    # Not on PyPI: a direct reference so both pip (the Docker image) and uv
    # resolve the pinned tag; this is the only place the version is pinned.
    "agent-operator-contract @ git+https://github.com/lbacik/agent-operator-contract@v1.0.4",
    "claude-agent-sdk==0.2.179",
    "python-dotenv==1.2.4",
    "PyYAML>=6.0,<7",
]

[project.scripts]
agentctl = "simple_coding_agent.agentctl:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "ruff==0.16.9",
    "jsonschema>=4.0,<5",
]

[tool.hatch.metadata]
# Required for the git direct reference to agent-operator-contract in
# [project] dependencies.
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Pyflakes, syntax errors and bugbear only; widen once the backlog is fixed.
select = ["F", "E9", "B"]
