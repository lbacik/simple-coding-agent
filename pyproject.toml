[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "simple-coding-agent"
version = "0.3.0"
description = "An unattended coding agent for one GitHub repository."
requires-python = ">=3.11"
dependencies = [
    "claude-agent-sdk==0.2.156",
    "python-dotenv>=1.2.3",
    "PyYAML>=6.0,<7",
]

[project.scripts]
agentctl = "simple_coding_agent.agentctl:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "ruff==0.16.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Pyflakes, syntax errors and bugbear only; widen once the backlog is fixed.
select = ["F", "E9", "B"]
