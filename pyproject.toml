[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "simple-coding-agent"
version = "0.1.0"
description = "An unattended coding agent for one GitHub repository."
requires-python = ">=3.11"
dependencies = [
    "claude-agent-sdk==0.2.156",
    "python-dotenv>=1.2.3",
    "PyYAML>=6.0,<7",
]

[project.scripts]
agentctl = "simple_coding_agent.agentctl:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
